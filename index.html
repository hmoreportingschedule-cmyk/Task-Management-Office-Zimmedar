<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Task Reporting</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;background:linear-gradient(135deg,#124b4d,#1e7b78);
}
.login-box{
  width:450px;max-width:92%;background:#f7fafb;border-radius:22px;
  padding:42px;box-shadow:0 20px 50px rgba(0,0,0,.22);
}
.logo{
  width:80px;height:80px;margin:0 auto 22px;border-radius:18px;
  background:#102f33;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:38px;
}
h1{text-align:center;color:#102f33;margin:0 0 8px;font-size:30px}
.sub{text-align:center;color:#77818a;margin-bottom:34px}
label{display:block;font-weight:bold;font-size:13px;color:#53606b;margin:0 0 8px}
input{
  width:100%;padding:16px;border:1px solid #d9dfe3;border-radius:12px;
  font-size:16px;outline:none;margin-bottom:20px;
}
input:focus{border-color:#249d99}
button{
  width:100%;padding:16px;border:0;border-radius:12px;background:#102f33;
  color:#fff;font-size:16px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.7;cursor:not-allowed}
.msg{text-align:center;margin-top:18px;font-size:14px;min-height:20px}
.admin{
  display:none;text-align:center;color:#102f33;
}
.admin h2{margin-top:0}
.logout{
  margin-top:25px;background:#777;
}
</style>
</head>
<body>

<div class="login-box">
  <div id="loginPanel">
    <div class="logo">▰</div>
    <h1>Office Task Reporting</h1>
    <div class="sub">Secure employee workspace & reporting portal</div>

    <label>USERNAME</label>
    <input id="username" type="text" value="MasterAdmin" autocomplete="username">

    <label>PASSWORD</label>
    <input id="password" type="password" value="Master@12345" autocomplete="current-password">

    <button id="loginBtn" onclick="login()">Login</button>
    <div id="msg" class="msg"></div>
  </div>

  <div id="adminPanel" class="admin">
    <div class="logo">✓</div>
    <h2>MasterAdmin Login Successful</h2>
    <p>Ab aap Admin section mein jaakar User create kar sakte hain.</p>
    <p><b>User ID:</b> MasterAdmin</p>
    <button class="logout" onclick="location.reload()">Logout</button>
  </div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyoP6eABSV8nMP2t1Z8xpQ60D89OXPI0y-UjeeMwBK2umE_g3pueIubc1njxiYRfjs/exec";

function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");

  if(username !== "MasterAdmin" || password !== "Master@12345"){
    msg.style.color = "#c62828";
    msg.textContent = "Invalid User ID or Password.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Authenticating...";
  msg.style.color = "#555";
  msg.textContent = "Login check ho raha hai...";

  const params = new URLSearchParams();
  params.append("action","login");
  params.append("username","MasterAdmin");
  params.append("password","Master@12345");

  fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:params.toString()
  })
  .then(r=>r.text())
  .then(text=>{
    let data;
    try{ data=JSON.parse(text); }catch(e){ data=null; }

    if(data && data.status === "success"){
      document.getElementById("loginPanel").style.display="none";
      document.getElementById("adminPanel").style.display="block";
    }else{
      // MasterAdmin credentials are fixed in this HTML.
      // Backend response is shown only when it explicitly rejects the login.
      msg.style.color="#c62828";
      msg.textContent =
        (data && data.message) ? data.message :
        "Google Apps Script login response nahi mila. Web App deployment/permission check karein.";
      btn.disabled=false;
      btn.textContent="Login";
    }
  })
  .catch(err=>{
    msg.style.color="#c62828";
    msg.textContent="Google Apps Script se connection nahi ho raha.";
    btn.disabled=false;
    btn.textContent="Login";
  });
}
</script>

</body>
</html>
